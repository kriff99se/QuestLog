# Bygger appen og lægger den på GitHub Pages, hver gang der pushes til main.
name: Deploy til GitHub Pages

on:
  push:
    branches: [main]
  # Gør det også muligt at køre deployet manuelt fra Actions-fanen.
  workflow_dispatch:

# Rettigheder som deployet skal bruge.
permissions:
  contents: read
  pages: write
  id-token: write

# Kør kun ét deploy ad gangen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Sæt Node op
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer pakker
        run: npm ci

      - name: Byg appen
        run: npm run build

      - name: Pak "dist"-mappen til upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Læg den på Pages
        id: deployment
        uses: actions/deploy-pages@v4
