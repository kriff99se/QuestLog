<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuestLog</title>

    <!-- Ikon i browserfanen. -->
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />

    <!-- PWA: farve på statuslinjen, og oplysninger iOS bruger, når appen
         ligger på hjemmeskærmen. "default" = iOS reserverer plads til
         statuslinjen, så indholdet ikke ryger op under uret/notchen. -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="QuestLog" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
  </head>
  <body>
    <!-- React tegner hele appen ind i denne tomme div. -->
    <div id="root"></div>
    <!-- Startfilen for JavaScript-koden. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
